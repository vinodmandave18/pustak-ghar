<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="gate" class="gate" hidden>
  <form id="adminLogin" class="gatebox">
    <h1>Admin sign in</h1>
    <p class="muted">Sign in using your administrator credentials.</p>
    <input name="email" type="email" placeholder="Admin email" required autocomplete="username">
    <input name="password" type="password" placeholder="Password" required autocomplete="current-password">
    <p class="err" role="alert"></p><button class="pay">Sign in</button>
    <a href="index.html" class="mute">Back to the store</a>
  </form>
</div>
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="side-brand" id="sideBrand">Admin</div>
    <nav id="menu"></nav>
    <div class="side-foot"><a href="index.html">View store</a><button class="link" id="adminLogout">Log out</button></div>
  </aside>
  <section class="content"><header class="bar"><h1 id="pageTitle"></h1><span id="who" class="mute"></span></header><div id="content"></div></section>
</div>
<script src="js/core.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
